name: Create Release
on:
  workflow_dispatch:
  push:
    # Publish `v1.2.3` tags as releases.
    tags:
      - v*

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine Java version
        id: jve
        shell: bash
        run: |
          for expr in maven.compiler.target maven.compiler.release java.version; do
            v=$(mvn -B -q -N help:evaluate -DforceStdout -Dexpression="$expr" 2>/dev/null || true)
            v=${v#1.}
            if [[ "$v" =~ ^[0-9]+ ]]; then
              echo "java_major_version=${BASH_REMATCH[0]}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Could not determine the Java version from the POM"
          exit 1
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ steps.jve.outputs.java_major_version }}
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn -U -B package

      - name: Create Changelog
        shell: bash
        run: |
          DIFF=$(git log $(git tag --sort=-creatordate | sed '2q;d')..HEAD --oneline)
          if [ -z "$DIFF" ]; then
            echo "Defaulting to full log"
            DIFF=$(git log --oneline)
          fi
          echo "# Commits since last release" > CHANGELOG.txt
          echo "$DIFF" | sed 's/^/* /' | sed '/Auto-Update Dependencies/{s/Updated/\n\t* Updated/g}' | sed '/\[maven-release-plugin\]/d' | sed -r '/.*\(#\w+\)$/d' >> CHANGELOG.txt

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          body_path: CHANGELOG.txt
          generate_release_notes: true
          files: |
            autograder-cmd/target/autograder-cmd.jar
